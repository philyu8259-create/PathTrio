name: PathTrio
options:
  bundleIdPrefix: com.phil
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 5
targets:
  PathTrio:
    type: application
    platform: iOS
    sources:
      - PathTrio
    resources:
      - PathTrio/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phil.PathTrio
        DEVELOPMENT_TEAM: 9SZ5257PF4
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PathTrio/PathTrio.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PathTrio
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: PathTrio uses location to record your workout route, distance, and speed while you are tracking a walk, run, or ride.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: PathTrio uses background location only during an active workout so it can keep recording your route when the screen is locked.
        INFOPLIST_KEY_NSMotionUsageDescription: PathTrio uses motion activity to provide optional Smart Assist alerts for pauses, activity changes, and unusual speeds.
        INFOPLIST_KEY_NSHealthShareUsageDescription: PathTrio checks relevant Apple Health workout permissions only to show and manage sync status.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: PathTrio writes completed walks, runs, rides, distance, and active energy to Apple Health when you enable sync.
    info:
      path: PathTrio/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: PathTrio uses location to record your workout route, distance, and speed while you are tracking a walk, run, or ride.
        NSLocationAlwaysAndWhenInUseUsageDescription: PathTrio uses background location only during an active workout so it can keep recording your route when the screen is locked.
        NSMotionUsageDescription: PathTrio uses motion activity to provide optional Smart Assist alerts for pauses, activity changes, and unusual speeds.
        NSHealthShareUsageDescription: PathTrio checks relevant Apple Health workout permissions only to show and manage sync status.
        NSHealthUpdateUsageDescription: PathTrio writes completed walks, runs, rides, distance, and active energy to Apple Health when you enable sync.
  PathTrioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PathTrioTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PathTrio
