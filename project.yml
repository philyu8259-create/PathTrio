name: PathTrio
options:
  bundleIdPrefix: com.phil
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 12
targets:
  PathTrio:
    type: application
    platform: iOS
    sources:
      - PathTrio
      - Shared
    resources:
      - PathTrio/Resources
    dependencies:
      - target: PathTrioWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phil.PathTrio
        DEVELOPMENT_TEAM: 9SZ5257PF4
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PathTrio/PathTrio.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PathTrio
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: PathTrio uses location to record route, distance, and speed for supported outdoor workouts.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: PathTrio uses background location only during an active workout so it can keep recording your route when the screen is locked.
        INFOPLIST_KEY_NSMotionUsageDescription: PathTrio uses motion activity to provide optional Smart Assist alerts for pauses, activity changes, and unusual speeds.
        INFOPLIST_KEY_NSCameraUsageDescription: PathTrio uses camera access to capture food photos for recognition.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: PathTrio uses photo library access to read food images for recognition.
        INFOPLIST_KEY_NSHealthShareUsageDescription: PathTrio checks relevant Apple Health workout permissions only to show and manage sync status.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: PathTrio writes completed supported workouts, distance when available, and active energy to Apple Health when you turn on sync.
    info:
      path: PathTrio/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: PathTrio uses location to record route, distance, and speed for supported outdoor workouts.
        NSLocationAlwaysAndWhenInUseUsageDescription: PathTrio uses background location only during an active workout so it can keep recording your route when the screen is locked.
        NSMotionUsageDescription: PathTrio uses motion activity to provide optional Smart Assist alerts for pauses, activity changes, and unusual speeds.
        NSCameraUsageDescription: PathTrio uses camera access to capture food photos for recognition.
        NSPhotoLibraryUsageDescription: PathTrio uses photo library access to read food images for recognition.
        NSHealthShareUsageDescription: PathTrio checks relevant Apple Health workout permissions only to show and manage sync status.
        NSHealthUpdateUsageDescription: PathTrio writes completed supported workouts, distance when available, and active energy to Apple Health when you turn on sync.
  PathTrioWatch:
    type: application
    platform: watchOS
    sources:
      - path: PathTrioWatch
        excludes:
          - Resources/**
      - Shared
      - path: PathTrioWatch/Resources/Assets.xcassets
        buildPhase: resources
      - path: PathTrioWatch/Resources/en.lproj
        buildPhase: resources
      - path: PathTrioWatch/Resources/zh-Hans.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phil.PathTrio.watchkitapp
        DEVELOPMENT_TEAM: 9SZ5257PF4
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PathTrio
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.phil.PathTrio
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  PathTrioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PathTrioTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PathTrio
